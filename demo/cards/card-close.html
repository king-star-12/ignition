<!doctype html><html><head><meta charset="utf-8">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1600px; height:900px; overflow:hidden; }

    background:#FBFAF3; color:#1E293B;

  .eyebrow { font-size:13px; letter-spacing:.22em; text-transform:uppercase; color:#64748B; font-weight:500; }
  .serif { font-family:Fraunces, Georgia, serif; }
  .lead { font-family:Fraunces, Georgia, serif; font-weight:600; color:#0C3B2A; letter-spacing:-.015em; }

  .seal { width:44px; height:44px; border-radius:999px;
    background:linear-gradient(135deg,#E0BC55,#C0982A 45%,#7E6212);
    display:grid; place-items:center; box-shadow:0 1px 0 rgba(255,255,255,.5) inset; }
  .seal svg { width:20px; height:20px; fill:#06231A; }

     <div>
       <div class="serif" style="font-size:26px;font-weight:600;color:#0C3B2A;letter-spacing:-.02em">Launch<span style="color:#7E6212">Pilot</span></div>

   </div>

 </div></body></html>
