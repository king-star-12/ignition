<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100vw;height:100vh;overflow:hidden}
  body{background:#FAF8F1;color:#1E293B;font-family:Inter,system-ui,sans-serif;
       display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  .wrap{width:74%}
  .eyebrow{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#64748B;font-weight:500}
  .lead{font-family:Fraunces,Georgia,serif;font-weight:600;color:#0C3B2A;letter-spacing:-.015em}
  .muted{color:#475569}
  .rule{height:1px;background:linear-gradient(to right,#C0982A,rgba(192,152,42,.15),transparent)}
  .logo{height:74px;width:auto;display:block}
</style></head><body><div class="wrap">
  <img class="logo" src="clustral-logo.png" alt="Clustral AI">
  <div class="lead" style="font-size:58px;line-height:1.1;margin-top:46px;max-width:1080px">
    Investigative agents,<br>pointed at your idea.
  </div>
  <div class="muted" style="font-size:22px;font-weight:300;margin-top:32px;max-width:860px;line-height:1.6">
    Clustral finds the small signal before it becomes irreversible.
    Committing a year to the wrong idea is about as irreversible as it gets.
  </div>
</div></body></html>
