<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1600px; height:900px; overflow:hidden; }
  body {
    background:#FBFAF3; color:#1E293B;
    font-family:Inter, ui-sans-serif, system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { width:1180px; }
  .eyebrow { font-size:13px; letter-spacing:.22em; text-transform:uppercase; color:#64748B; font-weight:500; }
  .serif { font-family:Fraunces, Georgia, serif; }
  .lead { font-family:Fraunces, Georgia, serif; font-weight:600; color:#0C3B2A; letter-spacing:-.015em; }
  .muted { color:#475569; }
  .rule { height:1px; background:linear-gradient(to right,#C0982A,rgba(192,152,42,.15),transparent); }
  .seal { width:44px; height:44px; border-radius:999px;
    background:linear-gradient(135deg,#E0BC55,#C0982A 45%,#7E6212);
    display:grid; place-items:center; box-shadow:0 1px 0 rgba(255,255,255,.5) inset; }
  .seal svg { width:20px; height:20px; fill:#06231A; }
</style></head><body><div class="wrap">
   <div class="eyebrow">Clustral AI</div>
   <div class="lead" style="font-size:76px;line-height:1.06;margin-top:38px;max-width:1050px">
     Everyone told you<br>the idea was great.
   </div>
   <div class="rule" style="margin:44px 0 28px;width:420px"></div>
   <div class="muted" style="font-size:26px;font-weight:300;letter-spacing:-.01em">None of that was evidence.</div>
 </div></body></html>
